<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香盤ジェネレーター</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 640px;
            width: 100%;
            text-align: center;
        }
        
        .version {
            position: fixed;
            top: 20px;
            right: 24px;
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 0.05em;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-bottom: 16px;
        }
        
        .catchphrase {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            color: #fff;
        }
        
        .subtitle {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 48px;
            line-height: 1.8;
        }
        
        .info-block {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 28px 32px;
            margin-bottom: 40px;
            text-align: left;
        }
        
        .info-block ul {
            list-style: none;
            padding: 0;
        }
        
        .info-block li {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 12px;
            padding-left: 20px;
            position: relative;
        }
        
        .info-block li:last-child {
            margin-bottom: 0;
        }
        
        .info-block li::before {
            content: "・";
            position: absolute;
            left: 0;
            color: #666;
        }
        
        .upload-area {
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 48px 40px;
            margin-bottom: 24px;
            transition: border-color 0.3s, background-color 0.3s;
            cursor: pointer;
        }
        
        .upload-area:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background-color: rgba(255, 255, 255, 0.02);
        }
        
        .upload-area.dragover {
            border-color: rgba(255, 255, 255, 0.6);
            background-color: rgba(255, 255, 255, 0.04);
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-btn {
            display: inline-block;
            background-color: #fff;
            color: #000;
            padding: 14px 36px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            transition: opacity 0.25s;
        }
        
        .upload-btn:hover {
            opacity: 0.85;
        }
        
        .file-name {
            margin-top: 16px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .submit-btn {
            background-color: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 14px 48px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            transition: all 0.25s;
        }
        
        .submit-btn:hover:not(:disabled) {
            background-color: #fff;
            color: #000;
            border-color: #fff;
        }
        
        .submit-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            margin-top: 32px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #fff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading p {
            font-size: 0.85rem;
            color: #666;
        }
        
        .message {
            margin-top: 24px;
            font-size: 0.9rem;
        }
        
        .error {
            color: #c44;
        }
        
        .success {
            color: #4a4;
        }
        
        footer {
            margin-top: auto;
            padding-top: 60px;
            font-size: 0.75rem;
            color: #444;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="version">β ver 0.1</div>
    
    <div class="container">
        <h1>香盤ジェネレーター</h1>
        <p class="catchphrase">助監督の時間を、少しだけ取り戻す。</p>
        <p class="subtitle">映画・ドラマ脚本（Word形式）を香盤表（CSV）に変換するベータ版サービスです。</p>
        
        <div class="info-block">
            <ul>
                <li>現在ベータ版です</li>
                <li>Word形式（.docx）の脚本をアップロードしてください</li>
                <li>生成されたCSVはExcelやGoogleスプレッドシートで編集してください</li>
                <li>アップロードされたデータは保存されません（処理後即削除）</li>
            </ul>
        </div>
        
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="upload-area" id="dropArea">
                <label for="fileInput" class="upload-btn">ファイルを選択</label>
                <input type="file" id="fileInput" name="file" accept=".docx">
                <p class="file-name" id="fileName">またはここにドラッグ＆ドロップ</p>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn" disabled>変換してダウンロード</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>処理中...</p>
        </div>
        
        <div id="message" class="message"></div>
    </div>
    
    <footer>© MEW Creators</footer>
    
    <script>
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const uploadForm = document.getElementById('uploadForm');
        const loading = document.getElementById('loading');
        const message = document.getElementById('message');
        
        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                fileName.textContent = this.files[0].name;
                submitBtn.disabled = false;
                message.innerHTML = '';
            }
        });
        
        dropArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });
        
        dropArea.addEventListener('dragleave', function() {
            this.classList.remove('dragover');
        });
        
        dropArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                if (files[0].name.endsWith('.docx')) {
                    fileInput.files = files;
                    fileName.textContent = files[0].name;
                    submitBtn.disabled = false;
                    message.innerHTML = '';
                } else {
                    message.innerHTML = '<p class="error">docxファイルのみ対応しています</p>';
                }
            }
        });
        
        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            submitBtn.disabled = true;
            loading.classList.add('active');
            message.innerHTML = '';
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'kouban.csv';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    
                    message.innerHTML = '<p class="success">ダウンロード完了</p>';
                    fileInput.value = '';
                    fileName.textContent = 'またはここにドラッグ＆ドロップ';
                } else {
                    const data = await response.json();
                    message.innerHTML = `<p class="error">${data.error || 'エラーが発生しました'}</p>`;
                }
            } catch (error) {
                message.innerHTML = '<p class="error">通信エラーが発生しました</p>';
            } finally {
                loading.classList.remove('active');
                submitBtn.disabled = fileInput.files.length === 0;
            }
        });
    </script>
</body>
</html>
